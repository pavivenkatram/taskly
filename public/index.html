<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskly</title>
  <style>
    :root { --bg:#faf8f5; --card:#fff; --ink:#1f2937; --muted:#6b7280; --accent:#d97757; --line:#e7e2da; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1c1b19; --card:#262522; --ink:#f1ede6; --muted:#9a948a; --line:#38362f; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
    main { max-width:560px; margin:0 auto; padding:32px 16px; }
    h1 { margin:0 0 4px; font-size:28px; }
    .sub { color:var(--muted); margin:0 0 24px; }
    form { display:flex; gap:8px; margin-bottom:20px; }
    input[type=text] { flex:1; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); font:inherit; }
    button { border:0; border-radius:10px; padding:12px 16px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
    ul { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
    li { display:flex; align-items:center; gap:12px; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
    li span { flex:1; }
    li.done span { text-decoration:line-through; color:var(--muted); }
    li button { background:transparent; color:var(--muted); padding:4px 8px; }
    .empty, .error { color:var(--muted); text-align:center; padding:24px 0; }
    .error { color:#b91c1c; }
  </style>
</head>
<body>
  <main>
    <h1>Taskly</h1>
    <p class="sub" id="count">Loading…</p>
    <form id="form">
      <input type="text" id="title" placeholder="What needs doing?" autocomplete="off" aria-label="New task">
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <div id="msg"></div>
  </main>

  <script>
    // Every user action becomes an HTTP request to the API, then the page re-renders.
    const list = document.getElementById("list");
    const msg = document.getElementById("msg");
    const count = document.getElementById("count");

    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!res.ok) throw new Error((await res.json()).error || "Request failed");
      return res.status === 204 ? null : res.json();
    }

    async function render() {
      try {
        const tasks = await api("GET", "/api/tasks");
        msg.innerHTML = "";
        const open = tasks.filter((t) => !t.done).length;
        count.textContent = tasks.length ? `${open} open, ${tasks.length - open} done` : "Nothing yet";
        list.innerHTML = "";
        if (!tasks.length) msg.innerHTML = '<div class="empty">Add your first task above.</div>';
        for (const t of tasks) {
          const li = document.createElement("li");
          if (t.done) li.className = "done";
          const box = document.createElement("input");
          box.type = "checkbox";
          box.checked = t.done;
          box.setAttribute("aria-label", "Mark done");
          box.onchange = () => api("PATCH", `/api/tasks/${t.id}`, { done: box.checked }).then(render);
          const text = document.createElement("span");
          text.textContent = t.title; // textContent avoids HTML injection
          const del = document.createElement("button");
          del.textContent = "✕";
          del.setAttribute("aria-label", "Delete task");
          del.onclick = () => api("DELETE", `/api/tasks/${t.id}`).then(render);
          li.append(box, text, del);
          list.append(li);
        }
      } catch (e) {
        msg.innerHTML = '<div class="error">Could not reach the API.</div>';
      }
    }

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("title");
      try {
        await api("POST", "/api/tasks", { title: input.value });
        input.value = "";
        render();
      } catch (err) {
        msg.innerHTML = `<div class="error">${err.message}</div>`;
      }
    };

    render();
  </script>
</body>
</html>
